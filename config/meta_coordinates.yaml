# Dimension names in each supported  data source (AKA model)
# Notes:
# (1) The key values (i.e. xc, yc, ...)  represent the internal
#     Eviz coordinate names while the model values are all the
#     Eviz-recognized coordinate names for that particular source
# (2)  A gridded model is common model often stored in NetCDF files

# x-coordinate name: model
xc:
    gridded: lon,longitude,im,Longitude,x,longitude_dim
    giss: im,lon,longitude
    crest: lon,longitude,im
    airnow: Longitude
    omi: Longitude,longitude,lon
    wrf:
        dim: west_east
        coords: XLONG,XLONG_U,XLONG_V
    lis:
        dim: east_west
        coords: lon

# y-coordinate name: model
yc:
    gridded: lat,latitude,jm,Latitude,y,latitude_dim
    giss: jm,lat,latitude
    crest: lat,latitude,jm
    airnow: Latitude
    omi: Latitude,latitude,lat
    wrf:
        dim: south_north
        coords: XLAT,XLAT_U,XLAT_V
    lis:
        dim: north_south
        coords: lat

# z-coordinate name: model
zc:
    gridded: lev,level,levels,plev,lm,eta_dim,z,eta_dim
    giss: lm,lev,level
    airnow: NA
    omi: NA
    wrf:
        dim: bottom_top,bottom_top_stag,soil_layers,soil_layers_stag
        coords: VERT
    lis:
        dim: RelSMC_profiles,SoilTemp_profiles,SoilMoist_profiles,SmLiqFrac_profiles

# time-coordinate name: model
tc:
    gridded: time,Time,rec_dim,ntimemax,t,rec_dim
    giss: ntimemax,time,Time
    crest: time,datetime,Time
    airnow: time
    omi: Time
    wrf:
        dim: Time
        coords: XTIME
    lis:
        dim: time
        coords: time

# chemical species name
spec:
    gmi: species_dim

# extra (auxiliary) dimensions — non-spatial, non-temporal
# Query with _get_model_dim_name("extra.<slot>", available_dims).
# Extra dims are recognized but not renamed by the standardization step.
extra:
    # bands coordinate: multiple 2D levels in satellite-derived data (e.g. FLDAS)
    bc:
        gridded: bnds,band,bands
    # cell-boundary coordinate: paired bound values for each grid cell
    bounds:
        gridded: bnds,bounds,nv,nbnd

