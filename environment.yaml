name: viz
channels:
  - conda-forge
dependencies:
  - python >=3.10,<3.14
  - matplotlib >=3.8.2
  - bokeh >=3.4.0
  - cartopy ==0.22.0
  - cftime >=1.6.3
  - dask ==2024.2.1
  - datashader >=0.15.0
  - h5py ==3.7.0
  - hdf4 ==4.2.15
  - hdf5 ==1.12.2
  - holoviews >=1.18.0
  - hvplot >=0.9.2
  - netcdf4 ==1.6.3
  - numpy ==1.26
  - pandas ==2.2
  - panel >=1.4.0
  - param >=2.0.0
  - pillow >=10.0.0
  - python-dateutil >=2.8.2
  - pyyaml >=6.0.1
  - requests >=2.31.0
  - scipy ==1.13.0
  - xarray ==2024.3.0
  - zarr ==2.13.3
  - pygrib
  - pyviz_comms ==3.0.1
  # for streamlit app
  - streamlit >=1.37.0
  - email-validator >=2.2.0
  - python-dotenv >=1.0.1
  # Testing and development dependencies
  - ipykernel
  - ipython >=8.5.0
  - flit >=3.9.0
  - pytest >=8.0.0
  - pip >=24.2.0
  - furo >=2023.9.10
  - sphinx >=7.0.0
  - sphinx-autobuild >=2024.4.16
  - sphinx-autodoc-typehints
  - sphinx-design
  - conda-forge::scikit-learn=1.5.2
  # Reserved for planned features, not currently imported by eviz:
  # - xesmf        (regridding is currently done via scipy.interpolate)
  # - pyhdf        (HDF4 support; Landsat/MOPITT currently read via the
  #                 generic h5py-based reader, which does not handle
  #                 classic HDF4 files)
  # - pydap        (OpenDAP access currently goes through xarray's
  #                 netcdf4 engine)
  # - networkx
  - pip:
      - sphinx_rtd_theme
      - myst-parser
      - sphinxcontrib-mermaid
      - pytest-cov
      - cfgrib
      - seaborn >=0.13.0

