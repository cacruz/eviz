[build-system]
requires = ["flit_core >=3.9,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "eviz"
description = "EViz: Earth System Model Visualization Toolkit"
dynamic = ["version"]
authors = [ { name = "EViz Contributors" }]
maintainers = [{ name = "Carlos Cruz", email = "carlos.a.cruz@nasa.gov" }, ]
readme = "README.rst"
keywords = [
    "visualization",
    "interactive",
    "eviz",
    "earth system model",
    "climate",
    "atmospheric science",
]
license = {file = "LICENSE"}
requires-python = ">=3.10"
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "matplotlib>=3.8.2",
    "cartopy>=0.22.0",
    "cftime>=1.6.3",
    "dask>=2024.2.0",
    "datashader>=0.15.0",
    "h5py>=3.7.0",
    "holoviews>=1.18.0",
    "hvplot>=0.9.2",
    "netCDF4>=1.6.3",
    "numpy>=1.24.4",
    "pandas>=1.5.3",
    "pillow>=10.0.0",
    "pyproj>=3.6.1",
    "python-dateutil>=2.8.2",
    "pyyaml>=6.0.1",
    "pyviz_comms>=3.0.1",
    "requests>=2.31.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.2",
    "seaborn>=0.13.0",
    "xarray>=0.21.1",
    "streamlit>=1.37.0",
    "email-validator>=2.2.0",
    "python-dotenv>=1.0.1"
    # Reserved for planned features, not currently imported by eviz:
    # xesmf (regridding is done via scipy.interpolate), pyhdf (HDF4 support;
    # not used by the current h5py-based HDF reader), pydap (OpenDAP access
    # goes through xarray's netcdf4 engine).
]

[project.urls]
Homepage = "https://github.com/cacruz/eviz"
Documentation = "https://cacruz.github.io/eviz/"
Source = "https://github.com/cacruz/eviz"
"Bug Tracker" = "https://github.com/cacruz/eviz/issues"
Changelog = "https://github.com/cacruz/eviz/blob/main/CHANGELOG.md"
Contributing = "https://github.com/cacruz/eviz/blob/main/CONTRIBUTING.rst"
"Code of Conduct" = "https://github.com/cacruz/eviz/blob/main/CODE_OF_CONDUCT.md"

[project.optional-dependencies]
dev = [
  "pip >=24.2.0",
  "pytest >=8.0.0",
  "ipython >=8.5.0",
]
docs = [
  "furo >=2023.9.10",
  "ipykernel",
  "sphinx >=7.0.0",
  "sphinx-autobuild >=2024.4.16",
  "sphinx-autodoc-typehints",
  "sphinx-design",
  "sphinx_rtd_theme",
]

[tool.flit.sdist]
include = [
  "eviz",
  "eviz/**",
  "config/**",
  "CHANGELOG.md",
  "CITATION.cff",
  "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.rst",
  "LICENSE",
  "README.rst"
]

exclude = ["tests/**"]

[tool.deptry.package_module_name_map]
"scikit-learn" = "sklearn"
"pyyaml" = "yaml"

[tool.pytest.ini_options]
markers = [
    "integtest: marks tests as integration (deselect with '-m \"not integtest\"')",
]
